[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "curvelets"
authors = [
  { name = "Carlos Alberto da Costa Filho", email = "c.dacostaf@gmail.com" },
]
description = "Open source implementation of the uniform discrete curvelet transform in Python."
readme = "README.md"
license.file = "LICENSE"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["numpy>=1.20", "typing_extensions; python_version<'3.12'"]

[project.optional-dependencies]
torch = ["torch"]
# FFT engines for the NumPy transform (UDCT(fft_engine=...)). When SciPy is
# installed, it is the default engine.
scipy = ["scipy"]
fftw = ["pyFFTW"]
# Intel MKL wheels exist for Linux x86_64 and Windows x64 only. mkl-service
# enables the SciPy-style interface, so fft_workers applies to MKL too.
mkl = [
  "mkl_fft; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "mkl-service; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[dependency-groups]
test = [
  "pytest>=6",
  "pytest-cov>=3",
  "pytest-timeout>=2.0",
  "coverage>=7.7.0",
  "matplotlib",
  # Exercises the NumPy transform's SciPy FFT engine and fft_engine="auto".
  "scipy",
  "torch",
  # Fused fold kernel tests (Triton's CPU interpreter in CPU-only CI). CPU torch
  # wheels do not pull it in; wheels exist for Linux x86_64 only.
  "triton; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.15'",
]
dev = [{ include-group = "test" }, { include-group = "docs" }]
docs = [
  "sphinx>=8.2.1",
  "myst_parser",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "sphinxcontrib-bibtex",
  "furo>=2023.08.17",
  "sphinx_gallery",
  "matplotlib",
  "scikit-learn",
  "pooch>=1.8.2",
  "scipy>=1.16.3",
  "scipy-stubs",
  "types-docutils",
  "cmap",
  "pylops>=2.3.0",
  "torch",
  "torchvision",
]

[project.urls]
Homepage = "https://github.com/cako/curvelets"
"Bug Tracker" = "https://github.com/cako/curvelets/issues"
Discussions = "https://github.com/cako/curvelets/discussions"
Changelog = "https://github.com/cako/curvelets/releases"


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/curvelets/_version.py"

[tool.hatch.envs.default]
dependency-groups = ["test"]
scripts.test = "pytest {args}"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/testdata"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:matplotlib._fontconfig_pattern",
  "ignore::DeprecationWarning:pyparsing",
  "ignore::DeprecationWarning:pyparsing.util",
  "ignore::DeprecationWarning:pyparsing.core",
  # torch >= 2.15 warns on macOS CI runners whose paravirtual GPU lacks Metal 2.0
  "ignore:Skipping device Apple Paravirtual device:UserWarning",
  # Free-threaded CPython re-enables the GIL to load Triton's extension (torch
  # imports Triton when it is installed, e.g. in torch.profiler)
  "ignore:The global interpreter lock \\(GIL\\) has been enabled to load module 'triton:RuntimeWarning",
  # ... and to load markupsafe's speedups (torch.compile imports jinja2)
  "ignore:The global interpreter lock \\(GIL\\) has been enabled to load module 'markupsafe:RuntimeWarning",
]
log_cli_level = "INFO"
testpaths = ["tests"]
markers = [
  "round_trip: Tests for forward+backward round-trip functionality",
  "slow: Slow-running tests that should be run separately",
  "timeout_to_xfail: Convert timeout failures to xfail instead of failures",
]


[tool.coverage]
run.source = ["curvelets"]
report.exclude_also = ['\\.\\.\\.', 'if typing.TYPE_CHECKING:']

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false


[[tool.mypy.overrides]]
module = "curvelets.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "numpy.*", "mkl_fft.*", "pyfftw.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torchvision.*",
  "triton.*",
  "kymatio.*",
  "pytorch_wavelets.*",
  "dtcwt.*",
  "tensorflow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "pylops.*"]
ignore_missing_imports = true




[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# Start with warnings to not break CI during migration
unused-ignore-comment = "warn"

[[tool.ty.overrides]]
include = ["examples/**"]

[tool.ty.overrides.rules]
# Relax matplotlib/sklearn type issues in examples
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"


[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear
  "I",   # isort
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "ICN", # flake8-import-conventions
  "G",   # flake8-logging-format
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "UP",  # pyupgrade
  "YTT", # flake8-2020
  "EXE", # flake8-executable
  "NPY", # NumPy specific rules
  "PD",  # pandas-vet
]
ignore = [
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "ISC001",  # Conflicts with formatter
  "PLC0415", # Imports of optional dependencies are intentionally lazy
  "LOG015",  # The library logs on the root logger by design
  "BLE001",  # Blind excepts are deliberate fallbacks
  "PYI018",  # Private TypeVars are used in runtime-evaluated aliases
  "PYI047",  # Private aliases are used in runtime-evaluated annotations
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["curvelets._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]
"examples/**" = ["T20"]
".github/scripts/**" = ["T20"]
"benchmarks/**" = ["T20", "BLE001", "PLC0415", "SLF001", "N806"]


[tool.pylint]
py-version = "3.11"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "wrong-import-position",
  # Should probably remove these eventually
  "invalid-name",
  "missing-class-docstring",
  "missing-function-docstring",
]

[tool.codespell]
# Author surnames in docs/references.bib
ignore-words-list = "childs"


[tool.uv]
exclude-newer = "30 days"
