name: Format

# Runs on every change, documentation included (the CI workflow skips
# documentation-only changes).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

# Third-party code (pre-commit hooks, pylint) runs here: read-only token.
permissions:
  contents: read

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install uv
        run: |
          pip install uv
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Run pre-commit
        run: uvx pre-commit run --hook-stage manual --all-files --show-diff-on-failure --color=always
      - name: Run PyLint
        run: |
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/matchers/pylint.json"
          pipx run nox -s pylint
