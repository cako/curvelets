name: CI

# Changes that cannot affect the tests skip the test matrix and the coverage
# upload: documentation, the other workflows, the release-build lock,
# Dependabot's config, and Python changes that only touch docstrings or
# comments. The `changes` job decides, with .github/scripts/code_changed.py
# (which holds the list of ignored paths); it compares the syntax trees of
# changed Python files, docstrings removed. CI does not run doctests, so
# docstrings cannot change the test results. The Format workflow (pre-commit,
# including the docs checks), the CD workflow and the Read the Docs build
# always run.
#
# The gate fails safe. It runs the script as it is on the base commit, so a pull
# request cannot rewrite the rules that judge it. Manual runs, new branches, a
# missing script and any error run the tests, and so does a failure of the
# `changes` job itself: the test jobs skip only on an explicit "false". Jobs
# skipped this way count as passed, so the run still finishes green.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

# Third-party packages (test dependencies) run in these jobs:
# give their GITHUB_TOKEN read access only.
permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # BASE is empty on workflow_dispatch and all zeros for a new branch; the
      # script treats both as a code change. `python -I` keeps the checkout
      # off the import path.
      - name: Compare with the base commit
        id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          SCRIPT: .github/scripts/code_changed.py
        run: |
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE:$SCRIPT" 2>/dev/null; then
            git cat-file blob "$BASE:$SCRIPT" > "$RUNNER_TEMP/code_changed.py"
            python -I "$RUNNER_TEMP/code_changed.py" "$BASE" "$HEAD"
          else
            echo "No gate script at the base commit ($BASE): treating as code change"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.runs-on }}
    # PyPy: numpy only ships PyPy 3.11 wheels, up to 2.4.x; best-effort job.
    continue-on-error: ${{ startsWith(matrix.python-version, 'pypy') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

        include:
          - python-version: pypy-3.11
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install package (PyPy)
        if: startsWith(matrix.python-version, 'pypy')
        run: |
          python -m pip install . --no-deps
          python -m pip install "numpy<2.5" typing_extensions pytest pytest-cov coverage matplotlib

      - name: Install package (CPython)
        if: "!startsWith(matrix.python-version, 'pypy')"
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # Before the test dependencies are installed: they pull in packages (e.g.
      # typing_extensions via torch) that a plain `pip install curvelets` lacks.
      - name: Smoke-test the bare install (CPython)
        if: "!startsWith(matrix.python-version, 'pypy')"
        run: python -c "import curvelets.numpy as c, numpy as np; u = c.UDCT(shape=(32, 32)); u.backward(u.forward(np.ones((32, 32))))"

      - name: Install test dependencies (CPython)
        if: "!startsWith(matrix.python-version, 'pypy')"
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install --group test

      - name: Test package (PyPy)
        if: startsWith(matrix.python-version, 'pypy')
        run: python -m pytest -ra --cov --cov-report=xml --cov-report=term --durations=20 --ignore=tests/torch --ignore=tests/numpy_torch_comparison

      - name: Test package (CPython)
        if: "!startsWith(matrix.python-version, 'pypy')"
        run: python -m pytest -ra --cov --cov-report=xml --cov-report=term --durations=20

      # The Codecov token is not exposed to this job, which runs third-party
      # code; the report is uploaded by the coverage job below.
      - name: Save coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.runs-on }}
          path: coverage.xml
          if-no-files-found: ignore

  coverage:
    name: Upload coverage
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Installs and runs no Python packages: only this job sees CODECOV_TOKEN.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage-reports
